<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>IronLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#14171A;
    --surface:#1C2024;
    --surface-2:#242830;
    --border:#2E333A;
    --text:#ECEDEE;
    --text-muted:#8A9199;
    --radius:14px;
    --plate-red:#C8382D;
    --plate-blue:#2E6DB4;
    --plate-yellow:#D9A62B;
    --plate-green:#3C8B4A;
    --plate-white:#C7CCD1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.02em;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
    padding-bottom:84px; position:relative;}
  .hidden{display:none !important;}

  /* ---------- Auth ---------- */
  #auth-screen{display:flex; flex-direction:column; justify-content:center; min-height:100vh;
    padding:32px 24px; max-width:480px; margin:0 auto;}
  .brand{text-align:center; margin-bottom:40px;}
  .brand .plate-mark{width:56px; height:56px; border-radius:50%; margin:0 auto 14px;
    background:conic-gradient(var(--plate-red) 0 25%, var(--plate-blue) 25% 50%,
    var(--plate-yellow) 50% 75%, var(--plate-green) 75% 100%);
    display:flex; align-items:center; justify-content:center;}
  .plate-mark::after{content:''; width:20px; height:20px; border-radius:50%; background:var(--bg);}
  .brand h1{font-size:32px; margin:0; letter-spacing:0.06em;}
  .brand p{color:var(--text-muted); margin:6px 0 0; font-size:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;
    text-transform:uppercase; letter-spacing:0.05em;}
  .field input{width:100%; padding:13px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-size:16px; font-family:'Inter',sans-serif;}
  .field input:focus{outline:none; border-color:var(--plate-blue);}
  .btn{width:100%; padding:14px; border-radius:10px; border:none; font-family:'Oswald',sans-serif;
    text-transform:uppercase; letter-spacing:0.05em; font-size:15px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--plate-red); color:#fff; margin-top:6px;}
  .btn-primary:active{opacity:0.85;}
  .btn-ghost{background:transparent; color:var(--text-muted); margin-top:14px; font-size:13px;
    text-transform:none; letter-spacing:0; font-family:'Inter',sans-serif;}
  .auth-error{color:var(--plate-red); font-size:13px; margin-top:10px; min-height:16px;}

  /* ---------- Header ---------- */
  header{padding:20px 20px 16px; display:flex; justify-content:space-between; align-items:flex-start;}
  header .greeting{font-size:22px; margin:0;}
  header .date{color:var(--text-muted); font-size:13px; margin-top:2px;}
  .avatar-btn{width:38px; height:38px; border-radius:50%; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif;
    font-size:14px; background:var(--surface); flex-shrink:0;}

  /* ---------- Tabs content ---------- */
  main{flex:1; padding:0 16px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:14px;}
  .card h2{font-size:16px; margin:0 0 4px;}
  .card .sub{color:var(--text-muted); font-size:12px; margin-bottom:14px;}
  .chalk-divider{border:none; border-top:1px dashed var(--border); margin:16px 0;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-box{background:var(--surface-2); border-radius:10px; padding:12px; text-align:center;}
  .stat-box .num{font-family:'Oswald',sans-serif; font-size:24px; line-height:1;}
  .stat-box .lbl{color:var(--text-muted); font-size:11px; text-transform:uppercase; margin-top:4px;}

  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .form-row.full{grid-template-columns:1fr;}
  .form-row label{grid-column:1/-1; font-size:12px; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:0.05em; margin-bottom:2px;}
  input[type=number]{width:100%; padding:11px 12px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:16px; font-family:'Inter',sans-serif;}
  input[type=number]:focus{outline:none; border-color:var(--plate-blue);}

  .workout-picker{display:flex; gap:10px; margin-bottom:14px;}
  .pill{flex:1; padding:11px; text-align:center; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); font-family:'Oswald',sans-serif; text-transform:uppercase;
    font-size:14px; letter-spacing:0.03em; cursor:pointer; color:var(--text-muted);}
  .pill.active{border-color:var(--plate-red); color:var(--text); background:rgba(200,56,45,0.12);}

  .exercise-block{margin-bottom:18px;}
  .exercise-block .ex-name{font-weight:600; font-size:14.5px; margin-bottom:2px;}
  .exercise-block .ex-target{color:var(--text-muted); font-size:12px; margin-bottom:10px;}
  .set-row{display:grid; grid-template-columns:32px 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px;}
  .set-row .set-num{color:var(--text-muted); font-family:'Oswald',sans-serif; font-size:13px; text-align:center;}
  .set-row input{text-align:center;}
  .set-row input::placeholder{color:#565C63;}

  /* Circle cards */
  .circle-card{display:flex; align-items:center; gap:14px; padding:16px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px;}
  .circle-plate{width:46px; height:46px; border-radius:50%; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-family:'Oswald',sans-serif; font-size:15px; color:#fff;}
  .circle-info{flex:1;}
  .circle-info .name{font-weight:600; font-size:15px;}
  .circle-info .meta{color:var(--text-muted); font-size:12px; margin-top:2px;}
  .circle-trend{text-align:right; font-family:'Oswald',sans-serif; font-size:15px;}
  .trend-down{color:var(--plate-green);}
  .trend-up{color:var(--plate-yellow);}

  /* History */
  .history-item{padding:14px 16px; border-bottom:1px solid var(--border);}
  .history-item:last-child{border-bottom:none;}
  .history-item .h-date{font-family:'Oswald',sans-serif; font-size:13px; color:var(--text-muted);
    text-transform:uppercase;}
  .history-item .h-title{font-weight:600; font-size:14.5px; margin-top:2px;}
  .history-item .h-detail{color:var(--text-muted); font-size:12.5px; margin-top:4px; line-height:1.5;}

  .empty-state{text-align:center; padding:36px 20px; color:var(--text-muted); font-size:13.5px;}

  /* Bottom nav */
  nav.bottom{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:var(--surface); border-top:1px solid var(--border); display:flex;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));}
  nav.bottom button{flex:1; background:none; border:none; color:var(--text-muted); font-family:'Oswald',sans-serif;
    text-transform:uppercase; font-size:11.5px; letter-spacing:0.04em; padding:6px 0; cursor:pointer;}
  nav.bottom button.active{color:var(--text);}
  nav.bottom button .dot{width:5px; height:5px; border-radius:50%; background:var(--plate-red); margin:0 auto 5px;
    opacity:0;}
  nav.bottom button.active .dot{opacity:1;}

  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--plate-green);
    color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:50;
    opacity:0; transition:opacity 0.25s;}
  .toast.show{opacity:1;}

  select.native{width:100%; padding:11px 12px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:15px; font-family:'Inter',sans-serif;}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="brand">
    <div class="plate-mark"></div>
    <h1>IronLog</h1>
    <p>Sets. Reps. Streaks. Shared.</p>
  </div>
  <div id="auth-form">
    <div class="field hidden" id="name-field">
      <label>Your name</label>
      <input type="text" id="display-name" placeholder="Sam">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="auth-email" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="auth-password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="auth-submit">Log In</button>
    <button class="btn btn-ghost" id="auth-toggle">Need an account? Sign up</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <header>
    <div>
      <h1 class="greeting" id="greeting">—</h1>
      <div class="date" id="today-date">—</div>
    </div>
    <button class="avatar-btn" id="signout-btn" title="Sign out">⏻</button>
  </header>

  <main>
    <!-- TODAY TAB -->
    <section id="tab-today">
      <div class="card">
        <h2>Morning Check-In</h2>
        <div class="sub" id="checkin-status">Log today's numbers</div>
        <div class="form-row">
          <label>Body Weight (lbs)</label>
          <input type="number" step="0.1" id="ci-weight" placeholder="185.0">
        </div>
        <div class="form-row">
          <div><label>Protein (g)</label><input type="number" id="ci-protein" placeholder="150"></div>
          <div><label>Carbs (g)</label><input type="number" id="ci-carbs" placeholder="200"></div>
        </div>
        <div class="form-row">
          <div><label>Water (L)</label><input type="number" step="0.1" id="ci-water" placeholder="3.0"></div>
          <div><label>Creatine (g)</label><input type="number" step="0.1" id="ci-creatine" placeholder="5"></div>
        </div>
        <button class="btn btn-primary" id="save-checkin">Save Check-In</button>
      </div>

      <div class="card">
        <h2>Log Workout</h2>
        <div class="sub">Pick today's session</div>
        <div class="workout-picker" id="workout-picker"></div>
        <div id="exercise-list"></div>
        <div class="form-row full">
          <label>Notes (optional)</label>
          <input type="text" id="session-notes" placeholder="Felt strong today...">
        </div>
        <button class="btn btn-primary" id="save-session">Save Session</button>
      </div>
    </section>

    <!-- HISTORY TAB -->
    <section id="tab-history" class="hidden">
      <div class="card" style="padding:0; overflow:hidden;">
        <div id="history-list"></div>
      </div>
    </section>

    <!-- CIRCLE TAB -->
    <section id="tab-circle" class="hidden">
      <div id="circle-list"></div>
    </section>
  </main>

  <nav class="bottom">
    <button class="nav-btn active" data-tab="today"><div class="dot"></div>Today</button>
    <button class="nav-btn" data-tab="history"><div class="dot"></div>History</button>
    <button class="nav-btn" data-tab="circle"><div class="dot"></div>Circle</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PLATE_COLORS = ['#C8382D','#2E6DB4','#D9A62B','#3C8B4A','#8A6FBE','#C7CCD1'];
function colorForId(id){
  let hash = 0;
  for(const ch of id) hash = (hash*31 + ch.charCodeAt(0)) >>> 0;
  return PLATE_COLORS[hash % PLATE_COLORS.length];
}

let currentUser = null;
let currentWorkoutId = null;
let workoutCache = []; // [{id, name, exercises:[{id, name, target_sets, target_reps}]}]

// ---------- Toast ----------
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// ---------- Auth ----------
let isSignupMode = false;
document.getElementById('auth-toggle').addEventListener('click', ()=>{
  isSignupMode = !isSignupMode;
  document.getElementById('name-field').classList.toggle('hidden', !isSignupMode);
  document.getElementById('auth-submit').textContent = isSignupMode ? 'Create Account' : 'Log In';
  document.getElementById('auth-toggle').textContent = isSignupMode ? 'Have an account? Log in' : 'Need an account? Sign up';
  document.getElementById('auth-error').textContent = '';
});

document.getElementById('auth-submit').addEventListener('click', async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter an email and password.'; return; }

  if(isSignupMode){
    const displayName = document.getElementById('display-name').value.trim() || email.split('@')[0];
    const { error } = await supabase.auth.signUp({
      email, password, options:{ data:{ display_name: displayName } }
    });
    if(error){ errEl.textContent = error.message; return; }
    toast('Account created — you\'re in');
  } else {
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = error.message; return; }
  }
});

document.getElementById('signout-btn').addEventListener('click', async ()=>{
  await supabase.auth.signOut();
});

supabase.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){
    currentUser = session.user;
    showApp();
  } else {
    currentUser = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('auth-screen').classList.remove('hidden');
  }
});

// ---------- App shell ----------
async function showApp(){
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  const { data: profile } = await supabase.from('profiles').select('display_name').eq('id', currentUser.id).single();
  const name = profile ? profile.display_name : 'there';
  document.getElementById('greeting').textContent = `Hey, ${name}`;
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

  await loadTodayCheckin();
  await loadWorkouts();
  switchTab('today');
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>switchTab(btn.dataset.tab));
});
function switchTab(tab){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('tab-today').classList.toggle('hidden', tab!=='today');
  document.getElementById('tab-history').classList.toggle('hidden', tab!=='history');
  document.getElementById('tab-circle').classList.toggle('hidden', tab!=='circle');
  if(tab==='history') loadHistory();
  if(tab==='circle') loadCircle();
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ---------- Check-in ----------
async function loadTodayCheckin(){
  const { data } = await supabase.from('daily_checkins').select('*')
    .eq('user_id', currentUser.id).eq('checkin_date', todayStr()).maybeSingle();
  if(data){
    document.getElementById('ci-weight').value = data.body_weight_lbs ?? '';
    document.getElementById('ci-protein').value = data.protein_g ?? '';
    document.getElementById('ci-carbs').value = data.carbs_g ?? '';
    document.getElementById('ci-water').value = data.water_l ?? '';
    document.getElementById('ci-creatine').value = data.creatine_g ?? '';
    document.getElementById('checkin-status').textContent = 'Logged for today — edit and re-save anytime';
  }
}

document.getElementById('save-checkin').addEventListener('click', async ()=>{
  const payload = {
    user_id: currentUser.id,
    checkin_date: todayStr(),
    body_weight_lbs: parseFloat(document.getElementById('ci-weight').value) || null,
    protein_g: parseFloat(document.getElementById('ci-protein').value) || null,
    carbs_g: parseFloat(document.getElementById('ci-carbs').value) || null,
    water_l: parseFloat(document.getElementById('ci-water').value) || null,
    creatine_g: parseFloat(document.getElementById('ci-creatine').value) || null,
  };
  const { error } = await supabase.from('daily_checkins').upsert(payload, { onConflict: 'user_id,checkin_date' });
  if(error){ toast('Error: ' + error.message); return; }
  toast('Check-in saved');
  document.getElementById('checkin-status').textContent = 'Logged for today — edit and re-save anytime';
});

// ---------- Workouts ----------
async function loadWorkouts(){
  const { data: program } = await supabase.from('programs').select('id')
    .eq('user_id', currentUser.id).eq('is_active', true).order('created_at', {ascending:false}).limit(1).maybeSingle();

  const picker = document.getElementById('workout-picker');
  if(!program){
    picker.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">No active program yet. Ask Claude to seed one, or add workouts directly in Supabase.</div>';
    return;
  }

  const { data: phases } = await supabase.from('program_phases').select('id, start_date, end_date')
    .eq('program_id', program.id).order('phase_order');
  const today = todayStr();
  let currentPhase = phases.find(p => (!p.start_date || p.start_date <= today) && (!p.end_date || p.end_date >= today));
  if(!currentPhase) currentPhase = phases[0];
  if(!currentPhase){ picker.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">No phases set up yet.</div>'; return; }

  const { data: workouts } = await supabase.from('workouts').select('id, name, workout_order')
    .eq('phase_id', currentPhase.id).order('workout_order');

  workoutCache = [];
  for(const w of workouts){
    const { data: wex } = await supabase.from('workout_exercises')
      .select('target_sets, target_reps, exercise_order, exercises(id, name)')
      .eq('workout_id', w.id).order('exercise_order');
    workoutCache.push({
      id: w.id, name: w.name,
      exercises: wex.map(x => ({ id: x.exercises.id, name: x.exercises.name, target_sets: x.target_sets, target_reps: x.target_reps }))
    });
  }

  picker.innerHTML = '';
  workoutCache.forEach((w, i)=>{
    const pill = document.createElement('div');
    pill.className = 'pill' + (i===0 ? ' active' : '');
    pill.textContent = w.name;
    pill.addEventListener('click', ()=> selectWorkout(w.id));
    picker.appendChild(pill);
  });
  if(workoutCache.length) selectWorkout(workoutCache[0].id);
}

async function selectWorkout(workoutId){
  currentWorkoutId = workoutId;
  document.querySelectorAll('#workout-picker .pill').forEach((p, i)=>{
    p.classList.toggle('active', workoutCache[i].id === workoutId);
  });
  const workout = workoutCache.find(w => w.id === workoutId);
  const exerciseIds = workout.exercises.map(e => e.id);

  // Pull most recent logged set per exercise/set-number for placeholder hints
  let lastMap = {};
  if(exerciseIds.length){
    const { data: recent } = await supabase.from('set_logs')
      .select('exercise_id, set_number, reps, weight_lbs, sessions!inner(session_date, user_id)')
      .eq('sessions.user_id', currentUser.id)
      .in('exercise_id', exerciseIds)
      .order('session_date', { foreignTable: 'sessions', ascending: false });
    (recent || []).forEach(r=>{
      const key = r.exercise_id + '_' + r.set_number;
      if(!(key in lastMap)) lastMap[key] = r;
    });
  }

  const list = document.getElementById('exercise-list');
  list.innerHTML = '';
  workout.exercises.forEach(ex=>{
    const block = document.createElement('div');
    block.className = 'exercise-block';
    block.dataset.exerciseId = ex.id;
    let setsHtml = '';
    const numSets = ex.target_sets || 3;
    for(let s=1; s<=numSets; s++){
      const hint = lastMap[ex.id + '_' + s];
      const repsPh = hint ? `${hint.reps} last` : 'reps';
      const wPh = hint ? `${hint.weight_lbs} lbs last` : 'lbs';
      setsHtml += `
        <div class="set-row" data-set="${s}">
          <div class="set-num">${s}</div>
          <input type="number" class="set-reps" placeholder="${repsPh}">
          <input type="number" step="0.5" class="set-weight" placeholder="${wPh}">
        </div>`;
    }
    block.innerHTML = `
      <div class="ex-name">${ex.name}</div>
      <div class="ex-target">Target: ${ex.target_sets} sets × ${ex.target_reps}</div>
      ${setsHtml}`;
    list.appendChild(block);
  });
}

document.getElementById('save-session').addEventListener('click', async ()=>{
  if(!currentWorkoutId){ toast('Pick a workout first'); return; }
  const notes = document.getElementById('session-notes').value.trim();

  const { data: session, error: sErr } = await supabase.from('sessions').insert({
    user_id: currentUser.id, workout_id: currentWorkoutId, session_date: todayStr(), notes: notes || null
  }).select().single();
  if(sErr){ toast('Error: ' + sErr.message); return; }

  const rows = [];
  document.querySelectorAll('#exercise-list .exercise-block').forEach(block=>{
    const exerciseId = block.dataset.exerciseId;
    block.querySelectorAll('.set-row').forEach(row=>{
      const setNum = parseInt(row.dataset.set);
      const reps = row.querySelector('.set-reps').value;
      const weight = row.querySelector('.set-weight').value;
      if(reps || weight){
        rows.push({
          session_id: session.id, exercise_id: exerciseId, set_number: setNum,
          reps: reps ? parseFloat(reps) : null, weight_lbs: weight ? parseFloat(weight) : null
        });
      }
    });
  });

  if(rows.length){
    const { error: lErr } = await supabase.from('set_logs').insert(rows);
    if(lErr){ toast('Error saving sets: ' + lErr.message); return; }
  }
  toast('Session saved 💪');
  document.getElementById('session-notes').value = '';
  selectWorkout(currentWorkoutId); // refresh placeholders with new data
});

// ---------- History ----------
async function loadHistory(){
  const list = document.getElementById('history-list');
  list.innerHTML = '<div class="empty-state">Loading...</div>';

  const { data: sessions } = await supabase.from('sessions')
    .select('id, session_date, notes, workouts(name), set_logs(exercise_id, reps, weight_lbs, exercises(name))')
    .eq('user_id', currentUser.id).order('session_date', { ascending:false }).limit(30);
  const { data: checkins } = await supabase.from('daily_checkins')
    .select('checkin_date, body_weight_lbs')
    .eq('user_id', currentUser.id).order('checkin_date', { ascending:false }).limit(30);

  const items = [];
  (sessions||[]).forEach(s=>{
    const byExercise = {};
    (s.set_logs||[]).forEach(sl=>{
      const n = sl.exercises ? sl.exercises.name : 'Exercise';
      byExercise[n] = byExercise[n] || [];
      if(sl.reps || sl.weight_lbs) byExercise[n].push(`${sl.reps||'-'}×${sl.weight_lbs||'-'}lbs`);
    });
    const detail = Object.entries(byExercise).map(([n, sets])=>`${n}: ${sets.join(', ')}`).join(' • ');
    items.push({ date: s.session_date, title: s.workouts ? s.workouts.name : 'Workout', detail: detail || s.notes || '', type:'workout' });
  });
  (checkins||[]).forEach(c=>{
    items.push({ date: c.checkin_date, title: 'Check-In', detail: c.body_weight_lbs ? `${c.body_weight_lbs} lbs` : '', type:'checkin' });
  });
  items.sort((a,b)=> b.date.localeCompare(a.date));

  if(!items.length){ list.innerHTML = '<div class="empty-state">No history yet — log your first session on Today.</div>'; return; }

  list.innerHTML = items.map(it=>`
    <div class="history-item">
      <div class="h-date">${new Date(it.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'})}</div>
      <div class="h-title">${it.title}</div>
      ${it.detail ? `<div class="h-detail">${it.detail}</div>` : ''}
    </div>
  `).join('');
}

// ---------- Circle ----------
async function loadCircle(){
  const list = document.getElementById('circle-list');
  list.innerHTML = '<div class="empty-state">Loading...</div>';

  const { data, error } = await supabase.from('circle_summary').select('*');
  if(error || !data || !data.length){
    list.innerHTML = '<div class="empty-state">No circle data yet — check in and log a session to get started.</div>';
    return;
  }

  list.innerHTML = data.map(m=>{
    const color = colorForId(m.user_id);
    const initial = (m.display_name||'?')[0].toUpperCase();
    const change = m.weight_change_7d;
    let trendHtml = '<span style="color:var(--text-muted); font-size:12px;">No trend yet</span>';
    if(change !== null && change !== undefined){
      const cls = change <= 0 ? 'trend-down' : 'trend-up';
      const arrow = change <= 0 ? '↓' : '↑';
      trendHtml = `<span class="${cls}">${arrow} ${Math.abs(change)} lbs</span><div style="color:var(--text-muted); font-size:10px;">7 days</div>`;
    }
    return `
      <div class="circle-card">
        <div class="circle-plate" style="background:${color};">${initial}</div>
        <div class="circle-info">
          <div class="name">${m.display_name || 'Unknown'}${m.user_id===currentUser.id ? ' (you)' : ''}</div>
          <div class="meta">${m.latest_weight ? m.latest_weight + ' lbs' : 'No weigh-in yet'} · ${m.sessions_last_7_days||0} sessions this week</div>
        </div>
        <div class="circle-trend">${trendHtml}</div>
      </div>`;
  }).join('');
}
</script>
